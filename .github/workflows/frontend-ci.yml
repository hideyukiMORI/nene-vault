name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # 週次 schedule — audit-ci（依存の既知脆弱性）を毎週拾う。
  # 艦ごとに分をずらしてフリート内同時発火を回避（このリポは 35 分）。
  # 🔴 制約: public リポの scheduled workflow は 60 日リポジトリ活動が無いと
  # GitHub 側で自動的に無効化される（公式仕様）。長期休眠すると週次検知も止まる。
  schedule:
    - cron: '35 0 * * 1'      # 月曜 00:35 UTC = 09:35 JST

  # 手動トリガー（simulate_failure で失敗通知経路を検証できる）
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '意図的に check を失敗させ、失敗通知の経路を検証する'
        type: boolean
        default: false

# concurrency: event_name を含めないと schedule/workflow_dispatch の実行が
# push の実行に cancel される（nene-origin PR #412 で実測）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Simulate failure (validation only)
        if: inputs.simulate_failure
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm run check = type-check + lint + format + coverage:check
      # (vitest --coverage + shrink-only ratchet) + knip + stylelint
      # + registries:check + build（本番バンドル・#352）+ build-storybook。
      #
      # 🔴 build の射程を誤読しないこと（#352 で実測・2026-08-05 @ 2c725d5）:
      # build は **CSS を守らない**。base.css に不正 CSS（`color: ;`・閉じない @media）を
      # 注入した実測では stylelint rc=2 に対し build rc=0・build-storybook rc=0 だった。
      # CSS の守りは stylelint 側で、build を足しても増えない（invoice #742 と同型）。
      #
      # build が実際に塞ぐのは **本番バンドル経路の解決性**。main.tsx から到達する
      # .ts/.tsx 78 本のうち 71 本は storybook のどの story からも到達せず、
      # そこに解決不能な import があっても type-check / lint / stylelint / knip /
      # build-storybook は全て rc=0 で素通りする（負テスト実測・#352 参照）。
      - name: Check (type-check, lint, format, coverage:check, knip, build, storybook build)
        run: npm run check

      # audit-ci = npm audit ＋ advisory 単位の allowlist（理由・期限つき例外）。
      # allowlist に無い high/critical は fail。config = frontend/audit-ci.jsonc
      - name: Audit (fail on high/critical)
        run: npm run audit

  notify-failure:
    name: Open an issue when the scheduled run fails
    if: failure() && (github.event_name == 'schedule' || inputs.simulate_failure)
    needs: [frontend-check]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE_TITLE: '🔴 nene-vault: 週次 CI（schedule）が失敗しています'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the failure issue
        run: |
          set -euo pipefail
          # --limit は open issue の総数より大きく取る。既定(30)や 100 のままだと
          # open が上限を超えた瞬間に同名 issue を取りこぼし、dedup が黙って
          # 重複起票へフォールバックする（#381）。重複こそが「通知が読まれなくなる」
          # 原因なので、dedup が静かに壊れる形は避ける。参照実装 = nene-serve PR #218。
          existing="$(gh issue list --state open --limit 1000 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          body="週次の schedule 実行が失敗しました。 実行: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
